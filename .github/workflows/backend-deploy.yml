name: Deploy Backend 

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      AWS_REGION: eu-west-1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Dependencies
      working-directory: ./backend
      run: npm ci

    - name: Create .env file for Serverless
      working-directory: ./backend
      run: |
        echo "NODE_ENV=production" >> .env
        echo "DB_DIALECT=postgres" >> .env
        echo "PORT=9001" >> .env
        echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
        echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
        echo "PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}" >> .env
        echo "INTELLIGENCE_SERVICE_KEY=${{ secrets.INTELLIGENCE_SERVICE_KEY }}" >> .env
        # Add any other required secrets below using the same format

    - name: Deploy with Serverless Framework
      working-directory: ./backend
      run: npx serverless deploy --stage prod
